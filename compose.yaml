services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staymanager
      POSTGRES_USER: staymanager
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U staymanager -d staymanager"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
    postgres_data: