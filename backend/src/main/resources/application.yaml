spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/staymanager
    username: staymanager
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  server:
    error:
      include-stacktree: never
      include-binding-errors: never
      include-message: never
      include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60