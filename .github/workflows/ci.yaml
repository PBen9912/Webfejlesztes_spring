name: StayManager CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check Java version
        run: java -version

      - name: Start PostgreSQL test database
        run: docker compose -f compose.test.yaml -p staymanager-test up -d --wait --wait-timeout 60

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build and test backend
        working-directory: backend
        run: ./mvnw clean verify

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'staymanager-backend'
          path: backend/target/*.jar
          if-no-files-found: 'error'

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        with:
          name: 'staymanager-coverage-report'
          path: backend/target/site/jacoco
          if-no-files-found: 'error'

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: staymanager-backend
          path: backend/target/

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Publish to GitHub Packages
        working-directory: backend
        run: |
          ./mvnw deploy:deploy-file \
            -Dfile=target/backend-0.0.1-SNAPSHOT.jar \
            -DpomFile=pom.xml \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/pben9912/webfejlesztes_spring
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}